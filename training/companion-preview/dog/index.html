<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小柴犬 · 互动预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#faf9f7;color:#39342e;font-family:system-ui,"Microsoft YaHei",sans-serif}main{max-width:960px;margin:auto;padding:40px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}header span{font-size:11px;color:#8b8174;letter-spacing:2px}.badge{border:1px solid #e9e2d9;border-radius:20px;padding:7px 12px;letter-spacing:0;font-size:11px;background:#fff}h1{font-size:28px;font-weight:500;letter-spacing:-1px;margin:42px 0 10px}.intro{font-size:13px;line-height:1.9;color:#8b8174;margin:0}.preview{margin-top:28px;background:white;border:1px solid #eee8e0;border-radius:24px;padding:25px 24px 28px;text-align:center;overflow:hidden}.name{font-size:12px;letter-spacing:3px;color:#a09381;margin:6px 0 0}.pet{display:block;position:relative;width:min(390px,100%);aspect-ratio:1;margin:0 auto;border:0;padding:0;background:#fff;border-radius:26px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:pan-y}.pet:focus-visible,button:focus-visible{outline:2px solid #bd9b6e;outline-offset:4px}.pet.happy .status{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:#8b8174;margin:2px 0 0;min-height:24px}.status:before{content:'';width:5px;height:5px;background:#bba27e;border-radius:50%}.hint{font-size:11px;color:#aaa095;margin:8px 0 22px;line-height:1.8}.controls{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}button.control{font:inherit;font-size:12px;background:#fff;border:1px solid #e9e2d9;color:#776b5d;border-radius:30px;padding:9px 16px;cursor:pointer}button.control[aria-pressed=true]{background:#f5eee4;border-color:#d7bea1;color:#7e5830}.settings{margin-top:23px;font-size:12px;color:#8b8174;display:flex;align-items:center;justify-content:center;gap:7px}.settings input{accent-color:#aa8353}.note{max-width:620px;margin:20px auto 0;font-size:11px;line-height:1.9;color:#a0978c;text-align:center}.loading{min-height:20px;font-size:12px;color:#9a7961}footer{margin:25px 0 0;text-align:center;font-size:10px;color:#b4a99a}@media(max-width:540px){main{padding:24px 16px}h1{margin-top:32px;font-size:24px}.preview{padding:20px 12px}.badge{font-size:10px}button.control{padding:8px 12px}.hint{margin-bottom:16px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style><link rel="stylesheet" href="./smooth.css">
</head>
<body><main>
<header><span>ORVYTH / COMPANION</span><span class="badge">独立预览 · 未替换聊天页</span></header>
<h1>它会慢慢看向你。</h1><p class="intro">移动鼠标试试。停一会儿，它也会眨眼、歪头，自己摇摇尾巴。</p>
<section class="preview" aria-label="小柴犬互动区域">
<p class="name">小 柴</p>
<button id="pet" class="pet" aria-label="摸摸小柴犬，让它开心歪头" disabled><span class="rig" aria-hidden="true"><span class="ground"></span><span id="tail" class="rig-part tail"></span><span id="torso" class="rig-part torso"></span><span id="head" class="head"><span class="head-face"></span><span id="closed-eyes" class="head-face head-closed"></span></span></span></button>
<div id="loading" class="loading" role="status">正在载入小柴犬…</div>
<p id="status" class="status" aria-live="polite">看着你</p><p class="hint">也可以用下面的按钮，或聚焦小狗后按方向键试试。</p>
<div class="controls" aria-label="姿态预览"><button class="control" data-pose="0" aria-pressed="false" disabled>正视</button><button class="control" data-pose="1" aria-pressed="false" disabled>向左看</button><button class="control" data-pose="2" aria-pressed="false" disabled>向右看</button><button class="control" data-pose="3" aria-pressed="false" disabled>抬头</button><button class="control" data-pose="4" aria-pressed="false" disabled>低头</button><button class="control" data-pose="5" aria-pressed="false" disabled>摸摸它</button><button id="idle-demo" class="control" disabled>试试小动作</button></div>
<div class="settings-group"><label class="settings"><input id="follow" type="checkbox" checked>头部跟随鼠标</label><label class="settings"><input id="idle" type="checkbox" checked>自己做小动作</label></div>
</section>
<p class="note">分层连续动画预览 · 头部平滑跟随，停下来也有小动作。当前为 2.5D 效果，尚非可大角度旋转的 3D 模型。</p>
<footer>只预览小柴犬 · 原来的聊天、任务和设置保持原样</footer>
</main><script src="./preview.js"></script></body></html>
