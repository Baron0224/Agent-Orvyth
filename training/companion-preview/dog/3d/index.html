<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小柴 · 真 3D 动作预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#faf9f7;color:#40382f;font-family:system-ui,'Microsoft YaHei',sans-serif}main{max-width:1000px;margin:auto;padding:28px 24px}header{display:flex;justify-content:space-between;color:#a59887;font-size:11px;letter-spacing:2px}header span:last-child{letter-spacing:0}h1{font-size:28px;font-weight:500;margin:30px 0 10px}p{font-size:12px;color:#948777;line-height:1.9}.card{background:#fff;border:1px solid #eee8df;border-radius:24px;margin-top:22px;overflow:hidden}.stage{position:relative;height:440px;touch-action:none;outline-offset:-4px}.stage canvas{display:block;width:100%;height:100%}.tag{position:absolute;top:22px;left:24px;font-size:10px;letter-spacing:2px;color:#a89781;pointer-events:none}.controls{padding:0 20px 25px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}button{font:inherit;font-size:12px;background:#fff;border:1px solid #e8dfd3;border-radius:22px;padding:9px 15px;color:#7e6e59;cursor:pointer}button:hover{background:#f7f2ec}button[aria-pressed=true]{background:#f0e6d7;border-color:#cbb08b}button:disabled{opacity:.5;cursor:wait}button:focus-visible,.stage:focus-visible{outline:2px solid #ad8861}.settings{display:flex;justify-content:center;gap:22px;padding-bottom:20px;font-size:11px;color:#9b8b76;flex-wrap:wrap}.settings label{display:flex;gap:6px;align-items:center}input{accent-color:#b29067}#status{text-align:center;min-height:25px;margin:0 0 12px;color:#a08c71;font-size:11px}footer{text-align:center;margin:17px auto;font-size:10px;color:#a99d8c;line-height:1.8}#error{margin:20px;color:#8e594b}@media(max-width:540px){main{padding:22px 14px}h1{font-size:23px}.stage{height:360px}button{padding:8px 12px}header{font-size:9px;letter-spacing:1px}}[hidden]{display:none!important}</style>

<body><main><header><span>ORVYTH / COMPANION</span><span>独立动作预览 · 未替换聊天页</span></header><h1>小柴，正在看着你。</h1><p>鼠标慢慢移向两侧，停下来看看它的小动作。先体验转头与身体配合，外观后续再细化。</p>
<section class="card"><div id="stage" class="stage" tabindex="0" role="img" aria-label="可互动的三维卡通小狗，移动鼠标让它转头，点按摸摸，方向键查看左右，按空格互动"><span class="tag">小柴 / 3D</span></div><p id="status" role="status">正在准备小狗…</p><p id="error" hidden></p><div class="controls"><button id="pat" disabled>摸摸它</button><button id="curious" disabled>歪头看看</button><button id="side" disabled aria-pressed="false">看看侧面</button><button id="front" disabled>回到正面</button><button id="pause" disabled aria-pressed="false">暂停动作</button></div><div class="settings"><label><input id="follow" type="checkbox" checked>跟随鼠标</label><label><input id="idle" type="checkbox" checked>空闲时自己活动</label></div></section><footer>转转头，摇摇尾巴，偶尔自己发会儿呆<br>先验证自然度，后续再细化毛发和表情。支持触摸拖动和方向键。</footer>
